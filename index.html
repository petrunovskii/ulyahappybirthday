<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пиксельный квест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #3a1f12; --paper: #ffe2a6; --paper-2: #f6c97c; --wood: #8a4a1c; --wood-dark: #4f260d; --trim: #e59a3a; --rose: #e2445c; --night: #1b1420;
  /* Основной текст: Rubik с полноценной кириллицей. Заголовки: пиксельный Press Start 2P, только кратно 8px и без жирности */
  --font: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --pixel: 'Press Start 2P', 'Rubik', system-ui, sans-serif;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.45; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-wrap: break-word; }
[hidden] { display: none !important; }
#game { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; display: block; }
img, canvas { image-rendering: pixelated; }
.px { font-family: var(--pixel); font-weight: 400; font-synthesis: none; letter-spacing: 0; line-height: 1.5; }

.panel { background: var(--paper); color: var(--ink); border: 4px solid var(--wood-dark); border-radius: 4px; box-shadow: inset 0 0 0 3px var(--trim), inset 0 0 0 5px var(--wood), 0 5px 0 rgba(20, 10, 25, .35); }
.btn { font-family: var(--pixel); font-weight: 400; font-synthesis: none; font-size: 16px; line-height: 1.5; color: var(--ink); padding: 14px 22px 12px; cursor: pointer; background: var(--paper); border: 4px solid var(--wood-dark); border-radius: 4px; box-shadow: inset 0 0 0 3px var(--trim), inset 0 -7px 0 var(--paper-2), 0 5px 0 rgba(20, 10, 25, .45); }
.btn { max-width: 100%; text-wrap: balance; }
.btn:hover { background: #fff0c9; }
.btn:active { transform: translateY(3px); box-shadow: inset 0 0 0 3px var(--trim), 0 2px 0 rgba(20, 10, 25, .45); }
.btn:focus-visible, .hud-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn.quiet { font-family: var(--font); font-weight: 500; font-size: 17px; line-height: 1.2; padding: 12px 18px; }

/* верхняя панель */
#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; pointer-events: none; }
.chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 9px; border-width: 3px; box-shadow: inset 0 0 0 2px var(--trim), 0 3px 0 rgba(20, 10, 25, .35); font-family: var(--pixel); font-synthesis: none; font-size: 16px; line-height: 24px; }
.chip img { height: 24px; width: auto; }
@media (max-width: 420px) { .chip { padding: 5px 9px 5px 7px; gap: 6px; } .chip img { height: 20px; } }
#goal { flex: 1 1 110px; min-width: 0; padding: 8px 13px; font-size: 16px; font-weight: 500; line-height: 1.3; border-width: 3px; box-shadow: inset 0 0 0 2px var(--trim), 0 3px 0 rgba(20, 10, 25, .35); max-width: 480px; }
.hud-btns { display: flex; gap: 8px; margin-left: auto; }
.hud-btn { pointer-events: auto; font: 500 15px/1.2 var(--font); color: var(--ink); padding: 9px 12px; cursor: pointer; border-width: 3px; box-shadow: inset 0 0 0 2px var(--trim), 0 3px 0 rgba(20, 10, 25, .35); white-space: nowrap; }
.hud-btn:hover { background: #fff0c9; }

#toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -14px); opacity: 0; transition: opacity .25s, transform .25s; display: flex; align-items: center; gap: 12px; padding: 11px 18px 11px 13px; font-size: 17px; line-height: 1.35; width: max-content; max-width: min(92vw, 520px); pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast img { height: 30px; flex: none; }
@media (max-width: 560px) { #toast { top: calc(112px + env(safe-area-inset-top, 0px)); } }

/* диалог */
#dlg { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding: 0 10px calc(14px + env(safe-area-inset-bottom, 0px)); cursor: pointer; touch-action: none; }
.dlg-box { width: min(780px, 100%); display: flex; min-height: 156px; }
.dlg-main { flex: 1; min-width: 0; padding: 18px 22px 30px; font-size: 21px; line-height: 1.4; position: relative; }
#dlgText { margin: 0; min-height: 4.2em; }
#dlgMore { position: absolute; right: 16px; bottom: 10px; width: 0; height: 0; border: 7px solid transparent; border-top: 9px solid var(--wood); animation: bob .7s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }
.dlg-side { flex: none; width: 138px; margin: 5px 5px 5px 0; padding: 9px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 7px; background: var(--paper-2); border-left: 3px solid var(--wood); }
#dlgFace { width: 102px; height: 102px; background: #f9b97a; border: 3px solid var(--wood-dark); }
#dlgWho { font-weight: 600; font-size: 16px; line-height: 1.2; text-align: center; max-width: 100%; }
@media (max-width: 560px) { .dlg-main { font-size: 18px; padding: 15px 16px 26px; } .dlg-side { width: 100px; } #dlgFace { width: 68px; height: 68px; } #dlgWho { font-size: 14px; } .dlg-box { min-height: 140px; } }

/* экраны поверх игры */
.overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); text-align: center; overflow-y: auto; }
.overlay > * { flex: none; }
.overlay h1, .overlay h2 { font-family: var(--pixel); font-weight: 400; font-synthesis: none; letter-spacing: 0; line-height: 1.5; margin: 0; text-wrap: balance; max-width: 100%; }
#title { background: linear-gradient(rgba(27, 20, 32, .35), rgba(27, 20, 32, .82)); color: var(--paper); }
#hero { width: min(520px, 92vw); height: auto; aspect-ratio: 104 / 30; }
#tTitle { font-size: 32px; color: var(--paper); text-shadow: 0 4px 0 var(--wood-dark), 0 8px 0 rgba(20, 10, 25, .5); }
#tSub { margin: 0; font-size: 20px; max-width: 34ch; line-height: 1.4; color: #ffeecb; }
#tCtl { margin: 6px 0 0; font-size: 15px; line-height: 1.45; max-width: 44ch; color: #e8d6c0; }

/* пролог */
#prologue { background: rgba(27, 20, 32, .8); justify-content: flex-start; }
.story { width: min(620px, 100%); margin: auto 0; padding: 26px 28px 26px; text-align: left; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
#storyCv { align-self: center; width: 336px; max-width: 100%; height: auto; aspect-ratio: 112 / 44; }
#pTitle { font-size: 24px; }
#pBody p { margin: 0 0 12px; font-size: 19px; line-height: 1.55; opacity: 0; transform: translateY(6px); animation: rise .5s ease-out forwards; animation-delay: calc(var(--i) * .4s + .15s); }
#pBody p:last-child { margin-bottom: 0; }
@keyframes rise { to { opacity: 1; transform: none; } }
#pBtn { align-self: center; margin-top: 4px; }

#mirror { background: radial-gradient(circle at 50% 38%, #4a3a6e 0, #1b1420 70%); color: var(--paper); justify-content: flex-start; }
#mirrorCv { width: 240px; height: 304px; margin-top: auto; }
#mirrorCv.flash { animation: flash .7s ease-out; }
@keyframes flash { 0% { filter: brightness(1); } 35% { filter: brightness(4) saturate(.2); } 100% { filter: brightness(1); } }
#mirrorList { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; min-height: 38px; }
#mirrorList li { background: #d6f1ff; color: #1f3a56; border: 3px solid #2f5f8a; padding: 5px 12px; font-size: 16px; font-weight: 600; line-height: 1.3; }
#mirrorOut { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: auto; }
#mirrorTitle { font-size: 24px; text-shadow: 0 3px 0 var(--wood-dark); }
#mirrorText { margin: 0; max-width: 40ch; font-size: 19px; line-height: 1.45; }
@media (max-height: 640px) { #mirrorCv { width: 180px; height: 228px; } }

#letter { background: rgba(27, 20, 32, .78); justify-content: flex-start; }
.letter-card { width: min(600px, 100%); margin: auto 0; padding: 30px 28px 26px; text-align: left; -webkit-user-select: text; user-select: text; }
#letterBouquet { display: block; width: 192px; height: 208px; margin: -6px auto 2px; }
#letterBouquetCap { margin: 0 0 16px; text-align: center; font-size: 15px; color: #7a4a2a; }
#letterTitle { margin-bottom: 16px; font-size: 24px; }
#letterBody p { margin: 0 0 12px; font-size: 19px; line-height: 1.55; }
#letterSign { margin: 4px 0 18px; font-size: 19px; font-weight: 600; text-align: right; }
#letterPS { margin: 0 0 16px; font-size: 18px; line-height: 1.5; font-style: italic; }
#letterReal { margin: 0 0 16px; padding: 14px 16px; background: #fff3d1; border: 3px dashed var(--wood); font-size: 19px; line-height: 1.45; font-weight: 600; }
#letterStats { margin: 0 0 18px; font-size: 16px; color: #7a4a2a; }
.letter-actions { display: flex; flex-wrap: wrap; gap: 12px; }

#confirm { background: rgba(27, 20, 32, .72); }
.confirm-card { width: min(420px, 100%); padding: 26px 24px 22px; text-align: left; }
#confirmText { margin: 0 0 18px; font-size: 19px; line-height: 1.45; font-weight: 500; }
.confirm-actions { display: flex; flex-wrap: wrap; gap: 12px; }

#fade { position: fixed; inset: 0; background: var(--night); opacity: 0; pointer-events: none; transition: opacity .38s; }
#fade.on { opacity: 1; }

@media (max-width: 700px) { #prologue { padding-left: 12px; padding-right: 12px; } .story { gap: 10px; padding: 18px 18px 18px !important; } #storyCv { width: 224px; } #pBody p { font-size: 16px !important; line-height: 1.45; margin-bottom: 9px; } }
@media (max-width: 700px) { #tTitle { font-size: 24px; } #tSub { font-size: 18px; } #pTitle, #mirrorTitle, #letterTitle { font-size: 16px; } .story, .letter-card { padding: 22px 20px 22px; } #pBody p, #letterBody p, #letterReal, #mirrorText { font-size: 18px; } }
@media (max-width: 360px) { #tTitle { font-size: 16px; } }
@media (max-height: 560px) and (min-aspect-ratio: 4/3) {
  #mirror { display: grid; grid-template-columns: auto minmax(0, 420px); justify-content: center; align-content: center; column-gap: 28px; row-gap: 12px; }
  #mirrorCv { grid-row: 1 / span 2; width: 180px; height: 228px; margin: 0; }
  #mirrorList { align-self: end; } #mirrorOut { align-self: start; margin: 0; }
  #hero { width: 312px; } #title { gap: 10px; } #tTitle { font-size: 24px; }
  #storyCv { width: 224px; }
}
@media (prefers-reduced-motion: reduce) { #dlgMore { animation: none; } #toast, #fade { transition: none; } #pBody p { animation: none; opacity: 1; transform: none; } }

</style>
</head>
<body>
<canvas id="game" aria-label="Игровое поле"></canvas>

<div id="hud" hidden>
  <div class="chip panel" title="Осколки зеркала"><img id="shardImg" alt="Осколки"><span id="shardN">0/0</span></div>
  <div class="chip panel" title="Цветы"><img id="flowerImg" alt="Цветы"><span id="flowerN">0/25</span></div>
  <div class="chip panel" title="Питомцы"><img id="petImg" alt="Питомцы"><span id="petN">0/0</span></div>
  <div id="goal" class="panel"></div>
  <div class="hud-btns"><button id="muteBtn" class="panel hud-btn" type="button" aria-pressed="false">Звук: вкл</button><button id="restartBtn" class="panel hud-btn" type="button"></button></div>
</div>

<div id="toast" class="panel" role="status"><img id="toastImg" alt=""><span id="toastText"></span></div>

<div id="dlg" hidden>
  <div class="dlg-box panel" id="dlgBox">
    <div class="dlg-main"><p id="dlgText" aria-live="polite"></p><span id="dlgMore"></span></div>
    <div class="dlg-side" id="dlgSide"><canvas id="dlgFace" width="34" height="34"></canvas><div id="dlgWho"></div></div>
  </div>
</div>

<div id="title" class="overlay">
  <canvas id="hero" width="104" height="30"></canvas>
  <h1 id="tTitle"></h1>
  <p id="tSub"></p>
  <button id="startBtn" class="btn" type="button"></button>
  <p id="tCtl"></p>
</div>

<div id="prologue" class="overlay" hidden>
  <div class="story panel">
    <canvas id="storyCv" width="112" height="44"></canvas>
    <h2 id="pTitle"></h2>
    <div id="pBody"></div>
    <button id="pBtn" class="btn" type="button"></button>
  </div>
</div>

<div id="mirror" class="overlay" hidden>
  <canvas id="mirrorCv" width="60" height="76"></canvas>
  <ul id="mirrorList"></ul>
  <div id="mirrorOut" hidden>
    <h2 id="mirrorTitle"></h2>
    <p id="mirrorText"></p>
    <button id="mirrorBtn" class="btn" type="button"></button>
  </div>
</div>

<div id="letter" class="overlay" hidden>
  <div class="letter-card panel">
    <canvas id="letterBouquet" width="48" height="52" hidden></canvas>
    <p id="letterBouquetCap" hidden></p>
    <h2 id="letterTitle"></h2>
    <div id="letterBody"></div>
    <p id="letterSign"></p>
    <p id="letterPS" hidden></p>
    <p id="letterReal"></p>
    <p id="letterStats"></p>
    <div class="letter-actions"><button id="letterStay" class="btn quiet" type="button"></button><button id="letterRestart" class="btn quiet" type="button"></button></div>
  </div>
</div>

<div id="confirm" class="overlay" hidden>
  <div class="confirm-card panel" role="alertdialog" aria-labelledby="confirmText">
    <p id="confirmText"></p>
    <div class="confirm-actions"><button id="confirmNo" class="btn quiet" type="button"></button><button id="confirmYes" class="btn quiet" type="button"></button></div>
  </div>
</div>

<div id="fade"></div>

<script>
/* ====================================================================================
   НАСТРОЙКИ: ТЕКСТЫ И ПЕРСОНАЖИ
   Все, что в квадратных скобках, это плейсхолдеры. Замените их своим текстом.
   Больше в коде ничего трогать не нужно.
   ==================================================================================== */
const TEXT = {
  title: 'День Рождения Принцессы',
  subtitle: 'От Юры для Ульяны',
  start: 'Начать игру',
  controls: 'Касание или клик: идти и говорить. Клавиатура: стрелки или WASD, пробел.',
  // Экран пролога: открывается после кнопки «Начать игру» и объясняет, что происходит
  prologueTitle: 'Пропажа принцессы',
  prologue: [
    'Одним солнечным осенним днем все в королевстве проснулись с предвкушением праздника. В этот день всеми любимой принцессе исполнилось 25 лет!',
    'В честь этого все жители королевства собрались на большой праздник - накрыли стол и принесли подарки. Но принцессы нигде не было! Все очень сильно расстроились. :(',
    'Тем более, что вход в замок возможен только если принцесса посмотрит в волшебное зеркало, которое накануне разбилось.',
    'Тебя, путник, тоже пригласили на праздник. Поговори с жителями и узнай, что случилось!'
  ],
  prologueBtn: 'Надо узнать!',
  goals: {
    ask: 'Поговори с жителями принцессы',
    mirror: 'Почини зеркало',
    gate: 'Войди в замок',
    hall: 'Подойди к Юре',
    done: '' // пустая строка скрывает плашку цели после письма
  },
  shardGot: 'Получен осколок зеркала:',
  shardName: 'Осколок',
  allShards: 'Подойди к зеркалу',
  mirrorNeed: 'В раме не хватает осколков. Расспроси жителей о принцессе.',
  mirrorAfter: 'С днем рождения, принцесса!',
  mirrorTitle: 'Так ты и есть принцесса!',
  mirrorText: 'С днем рождения, Ульяна!',
  mirrorBtn: 'Дальше',
  gateLocked: 'Ворота заперты. Они откроются, когда принцесса посмотрит в волшебное зеркало.',
  gateOpened: 'Скорее на праздник!!',
  sign: 'Деревня «Ульяновск»',
  chorus: 'Ульяна поздравляем с днем рождения дорогая!!',
  chorusName: 'Все хором',
  hallHint: 'Нажми на гостя с сердечком, чтобы услышать поздравление',
  letterTitle: 'С днем рождения!',
  letter: [
    'Ульяна, моя любовь и самый дорогой человек, моя Альфа и Омега, с днем рождения тебя!',
    'Как я уже когда-то говорил, я каждый раз удивляюсь тому, насколько удивительна ты. Я просто хотел бы сказать тебе спасибо за твоё существование. Ты наполняешь каждый мой день смыслом, вселяешь в меня желание исполнять цели и становиться ради тебя лучше с каждым днем. Не найдётся способа выразить мою любовь и привязанность к тебе, то желание и восторг, которыми ты меня наполняешь, и то, насколько важно твоё существование в моей жизни. Я просто хочу скорее вернуться, обнять тебя и никогда больше не отпускать.',
    'Ты - лучшее, что со мной случалось! Оставайся такой же смелой, жизнерадостной, справедливой и любимой. Обнимаю и целую! ❤️'
  ],
  realWorld: '', // пустая строка скрывает рамку перехода в реальный мир
  signature: 'Твой Юра',
  petsAll: 'Все питомцы в сборе! Теперь они чуют цветы и ведут к ближайшему.',
  petsPS: 'И мы поздравляем тебя! От Свинок, Розика и Сары!',
  trackOn: 'Граммофон играет пластинку',
  trackOff: 'Снова играет «Happy Birthday»',
  trackMissing: 'Файл song.mp3 не найден: положите его в папку с игрой',
  bouquetName: 'Букет',
  bouquetGot: 'Юра дарит букет из собранных цветов:',
  bouquetCap: 'Букет из собранных цветов:',
  flowersFound: 'Найдено цветов:',
  petsFound: 'Питомцы:',
  letterStay: 'Остаться в зале',
  restart: 'Сыграть заново',
  restartBtn: 'Заново',
  restartAsk: 'Начать игру заново? Весь прогресс сбросится.',
  restartYes: 'Да, заново',
  restartNo: 'Отмена'
};

/* Цветы на карте: пока вместо воспоминаний показывается название цветка.
   Сколько строк, столько и цветов. kind: peony | ranunculus | rose. Позже в text можно вписать воспоминание. */
const FLOWERS = [
  { text: 'Пион «Сара Бернар»', kind: 'peony', col: '#f4a3c4' },
  { text: 'Пион «Коралловый шарм»', kind: 'peony', col: '#ff8f7a' },
  { text: 'Пион «Дюшес де Немур»', kind: 'peony', col: '#fbf3df' },
  { text: 'Ранункулюс розовый', kind: 'ranunculus', col: '#f7b3cf' },
  { text: 'Ранункулюс персиковый', kind: 'ranunculus', col: '#ffc29a' },
  { text: 'Ранункулюс белый', kind: 'ranunculus', col: '#fdf8ec' },
  { text: 'Пионовидная роза «Джульетта»', kind: 'rose', col: '#f9c9a0' },
  { text: 'Пионовидная роза «Кейра»', kind: 'rose', col: '#f6c6d0' },
  { text: 'Пионовидная роза «Пейшенс»', kind: 'rose', col: '#f8eed8' },
  { text: 'Пионовидная роза «Миранда»', kind: 'rose', col: '#f08fb4' }
];

/* Жители с осколками. Добавьте или уберите объект, счетчик осколков пересчитается сам.
   look: ключ из LOOKS ниже. x, y: клетка на карте деревни. */
const CAST = [
  { id: 'a', name: 'Танечка', look: 'A', x: 8, y: 16,
    lines: [
      'Ах, где же Ульянка! Так без нее грустно и одиноко, да еще и с Розкой некому гулять(',
      'Помню, как Маленькая Ульянка захотела проколоть уши. Сказала: я боюсь, но хочу.',

      // огоньки свечей на торте

      // ноты из граммофона
      for (const n of state.notes) { ctx.globalAlpha = Math.min(1, (n.life - n.t) * 1.4); ctx.drawImage(A.notes[n.k], Math.round(n.x + Math.sin(n.t * 3 + n.ph) * 5 - n.t * 5) - cx, Math.round(n.y - n.t * 15) - cy); } ctx.globalAlpha = 1;
    }
    // хлопушки и конфетти из торта
    for (const q of state.pops) { ctx.globalAlpha = Math.min(1, (q.life - q.t) * 2); ctx.fillStyle = q.c; ctx.fillRect(Math.round(q.x) - cx, Math.round(q.y) - cy, 2, ((q.t * 12 | 0) % 2) ? 2 : 1); } ctx.globalAlpha = 1;
    // маркеры
    const bob = Math.round(Math.sin(t * 5) * 1.5);
    if (state.mode === 'play' || state.mode === 'dialog') {
      for (const e of m.ents) {
        if (e.kind === 'npc' && !e.hall && !e.given) ctx.drawImage(A.bang, Math.round(e.px) + 4 - cx, Math.round(e.py) - 22 + bob - cy);
        if (e.kind === 'pig' && !e.following) ctx.drawImage(A.heart, Math.round(e.px) + 3 - cx, Math.round(e.py) + e.sheet.oy - 12 + bob - cy);
        if (e.kind === 'npc' && e.hall && !e.heard && state.talk !== e) { const a = reduced ? { dx: 0, dy: 0 } : humanAnim(e, t); ctx.drawImage(A.bubble, Math.round(e.px) + 2 + a.dx - cx, Math.round(e.py) - 25 + a.dy + bob - cy); }

      }
      if (m.id === 'hall' && !state.gramSeen) ctx.drawImage(A.bang, 13 * T + 12 - cx, 3 * T - 20 + bob - cy);
      if (m.id === 'village') { if (!state.mirrorDone && state.shards.length >= CAST.length) ctx.drawImage(A.bang, 16 * T + 4 - cx, 8 * T - 16 + bob - cy); if (state.gateOpen) ctx.drawImage(A.bang, 20 * T - 4 - cx, 4 * T + 4 + bob - cy); }

        else { const px = Math.max(ml, Math.min(VW - ml, fx)), py = Math.max(mt, Math.min(VH - mb, fy)), a = Math.atan2(fy - py, fx - px), ox = Math.round(Math.cos(a) * (9 + bob * 0.6)), oy = Math.round(Math.sin(a) * (9 + bob * 0.6));
          ctx.drawImage(A.paw, Math.round(px) - 6, Math.round(py) - 5); ctx.fillStyle = OUT; ctx.fillRect(Math.round(px) + ox - 2, Math.round(py) + oy - 2, 5, 5); ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(px) + ox - 1, Math.round(py) + oy - 1, 3, 3); }

    }
    if (tapMark) { ctx.globalAlpha = Math.min(1, tapMark.t * 3); ctx.fillStyle = '#fff'; const x = tapMark.x * T - cx, y = tapMark.y * T - cy, g = Math.round((0.4 - tapMark.t) * 6); for (const [ax, ay, sx, sy] of [[0, 0, 1, 1], [15, 0, -1, 1], [0, 15, 1, -1], [15, 15, -1, -1]]) { ctx.fillRect(x + ax + sx * g - (sx < 0 ? 3 : 0), y + ay + sy * g, 4, 1); ctx.fillRect(x + ax + sx * g, y + ay + sy * g - (sy < 0 ? 3 : 0), 1, 4); } ctx.globalAlpha = 1; }
    if (confetti && m.id === 'hall') for (const c of confetti) { ctx.fillStyle = c.c; ctx.fillRect(Math.round(c.x + Math.sin(c.ph) * 4), Math.round(c.y), 2, Math.sin(c.ph * 2) > 0 ? 2 : 1); }
  }
  function resize() { const w = innerWidth, h = innerHeight; SCALE = Math.max(2, Math.round(Math.min(w, h) / 240)); VW = Math.ceil(w / SCALE); VH = Math.ceil(h / SCALE); cv.width = VW; cv.height = VH; cv.style.width = VW * SCALE + 'px'; cv.style.height = VH * SCALE + 'px'; ctx.imageSmoothingEnabled = false; }
  function loop(ts) { const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; update(dt); draw(); requestAnimationFrame(loop); }

  /* ---------- запуск ---------- */
  function art() {
    A.sheets = {}; A.faces = {}; for (const k in LOOKS) { A.sheets[k] = LOOKS[k].pig ? pigSheet(LOOKS[k]) : LOOKS[k].dog ? dogSheet(LOOKS[k]) : LOOKS[k].cat ? catSheet(LOOKS[k]) : charSheet(LOOKS[k]); A.faces[k] = portrait(LOOKS[k]); }
    A.trees = [makeTree(1), makeTree(2), makeTree(7), makeTree(3, 'dark'), makeTree(4, 'dark'), makeTree(5, 'blossom')]; A.bushes = [makeBush(1), makeBush(2), makeBush(6)]; A.rocks = [makeRock(1), makeRock(2)];
    A.castle = makeCastle(false); A.castleOpen = makeCastle(true); A.brazier = [makeBrazier(0), makeBrazier(1)]; A.mirror = makeMirror(false); A.mirrorFull = makeMirror(true); A.table = makeFeastTable(); A.sideTable = makeSideTable(); A.hallWall = makeHallWall(256);
    A.flowers = FLOWERS.map(f => makeBloom(f.kind, f.col)); A.flowerUrl = A.flowers.map(c => c.toDataURL()); A.shard = makeShard(); A.bang = makeBang(); A.heart = makeHeartIcon(); A.paw = makePaw(); A.ball = makeBall(); A.bubble = makeBubble(); A.bubbleUrl = A.bubble.toDataURL(); A.suitcase = makeSuitcase(); A.gramophone = makeGramophone(); A.notes = ['#ffffff', '#ffe36e', '#f7a8c8', '#a6dcf7'].map(makeNote); A.noteUrl = A.notes[1].toDataURL(); $('petImg').src = A.paw.toDataURL();
    $('shardImg').src = A.shard.toDataURL(); $('flowerImg').src = A.flowerUrl[0];
    const h = $('hero'), g = h.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, 104, 30); if (A.sheets.rosa) g.drawImage(A.sheets.rosa.right[0], 2, 12); g.drawImage(A.sheets.pig1.right[0], 23, 16); g.drawImage(A.sheets.wanderer.down[0], 43, 2); g.drawImage(A.sheets.pig2.left[0], 64, 16); if (A.sheets.sara) g.drawImage(A.sheets.sara.left[0], 84, 13);
    // иллюстрация к прологу: накрытый стол и встревоженные жители
    const s = $('storyCv').getContext('2d'); s.imageSmoothingEnabled = false; s.clearRect(0, 0, 112, 44);
    s.fillStyle = 'rgba(58,31,18,.18)'; s.fillRect(2, 40, 108, 2); s.fillRect(8, 42, 96, 1);
    s.drawImage(A.sheets[CAST[0] ? CAST[0].look : 'A'].right[0], 3, 15); s.drawImage(A.table, 23, 9); s.drawImage(A.sheets[CAST[1] ? CAST[1].look : 'B'].left[0], 91, 15);
    s.drawImage(A.bang, 8, 4); s.drawImage(A.bang, 96, 4);
  }
  function init() {
    musicStop(); trackStop(); gen++;
    state = { mode: 'title', t: 0, shards: [], flowers: 0, followers: [], fx: [], pops: [], notes: [], talk: null, danceT: 0, heartT: 0, gramSeen: false, bouquet: null, hallT: 0, popT: 0, noteT: 0, popSide: 0, petsAll: false, mirrorDone: false, gateOpen: false, finished: false, goal: 'ask' };
    pigs = []; trail = []; confetti = null; tapMark = null; cam = { x: 0, y: 0, rx: 0, ry: 0, shift: 0 };
    maps = {}; maps.village = buildVillage(); maps.hall = buildHall(); state.map = maps.village;
    pl = { x: 20, y: 29, px: 20 * T, py: 29 * T, nx: 20, ny: 29, t: 0, dir: 'up', frame: 0, anim: 0, moving: false, path: null, pending: null, sheet: A.sheets.wanderer };
    snapCam(); hud(); goal('ask');
  }
  function startGame() {

    $('pTitle').textContent = TEXT.prologueTitle; $('pBody').innerHTML = ''; TEXT.prologue.forEach((t, i) => { const p = document.createElement('p'); p.textContent = t; p.style.setProperty('--i', i); $('pBody').appendChild(p); });
    $('pBtn').focus({ preventScroll: true });
  }
  // Полный перезапуск: закрывает все окна, сбрасывает прогресс и возвращает на титульный экран
  function resetToTitle() {

    $('toast').classList.remove('on'); $('fade').classList.remove('on'); $('mirrorCv').classList.remove('flash');

  }
